version: '3.8'

services:
  social-pulse:
    container_name: social-pulse
    image: node:20-alpine
    restart: always
    working_dir: /app
    command: node server.js
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - JWT_SECRET=social_pulse_super_secret_jwt_key_2025_prod
      - GOOGLE_PLACES_API_KEY=AIzaSyAf3Bpi3bOpSq-h8qiBdVx-gcrEk4fd660
      - GOOGLE_PLACE_ID=ChIJb4BlCW20bTkRjY9rIogywsM
      - LINKEDIN_ORG_ID=112470973
      - MONGODB_URI=mongodb://akashxofficialin_db_user:NKOavvwjTlPgLc3s@ac-oyb8u0k-shard-00-00.q2jxis4.mongodb.net:27017,ac-oyb8u0k-shard-00-01.q2jxis4.mongodb.net:27017,ac-oyb8u0k-shard-00-02.q2jxis4.mongodb.net:27017/social_pulse?ssl=true&replicaSet=atlas-qsgpcj-shard-0&authSource=admin&retryWrites=true&w=majority
